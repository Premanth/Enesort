name: EcoSort v2 CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc-12, clang-14]
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-12 clang-14 \
            python3 python3-pip
          pip3 install numpy pandas scipy

      - name: Configure (${{ matrix.compiler }}, ${{ matrix.build_type }})
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc-12" ]]; then
            export CC=gcc-12 CXX=g++-12
          else
            export CC=clang-14 CXX=clang++-14
          fi
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DECOSORT_FETCH_DEPS=ON \
            -DECOSORT_ENABLE_SANITIZERS=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run correctness tests
        run: ./build/test_correctness

      - name: Run smoke benchmark
        run: |
          mkdir -p results/raw
          ./build/bench --smoke --trials 3 --sizes 1000,10000 \
            > results/raw/ci_smoke.csv
          head -5 results/raw/ci_smoke.csv

      - name: Verify CSV output
        run: python3 -c "
          import pandas as pd, sys
          df = pd.read_csv('results/raw/ci_smoke.csv')
          assert len(df) > 0, 'Empty CSV'
          assert df['sorted_ok'].all(), 'Sort correctness failure'
          assert df['multiset_ok'].all(), 'Multiset failure'
          print(f'CI smoke: {len(df)} rows, all correct')
          "

  sanitizer-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Build with ASan+UBSan
        run: |
          cmake -B build_san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DECOSORT_FETCH_DEPS=ON \
            -DECOSORT_ENABLE_SANITIZERS=ON
          cmake --build build_san --parallel 4 --target test_correctness

      - name: Run sanitized tests
        run: |
          ASAN_OPTIONS=halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./build_san/test_correctness

